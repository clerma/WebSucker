          <h1>Website Sucker — Back Up, Archive &amp; Transfer Any Website</h1>
          <p><strong>Website Sucker is a free online tool to back up, archive, and transfer any website.</strong> Paste a URL and it downloads a complete offline copy — every page, image, stylesheet, JavaScript file, and font — packaged into a single ZIP that opens in any browser. There's nothing to install, and analysing is free; downloads start at $1.99.</p>

          <h2>How to back up a website</h2>
          <ol>
            <li><strong>Enter the URL</strong> of the website you want to back up — analysing is free.</li>
            <li><strong>Review every asset</strong> Website Sucker finds before you pay.</li>
            <li><strong>Download the offline ZIP</strong> for $1.99, or $5.99/month for unlimited.</li>
          </ol>

          <h2>The website tools you need in one place</h2>
          <ul>
            <li><strong>Website backup</strong> — keep a complete, offline copy of any site</li>
            <li><strong>Website archive</strong> — preserve a snapshot that stays usable if the live site changes</li>
            <li><strong>Transfer a website</strong> — move HTML, CSS, JS, images, and fonts to a new host or platform</li>
            <li><strong>Download all images, CSS, and JavaScript</strong> from a page</li>
          </ul>

          <h2>What it downloads</h2>
          <ul>
            <li>HTML pages, CSS stylesheets, JavaScript files</li>
            <li>Images, fonts, and other assets</li>
            <li>Embedded content: YouTube, Vimeo, Google Maps, Spotify, and more</li>
            <li>Packages everything into an organised ZIP that works fully offline</li>
          </ul>

          <h2>Works on every platform and device</h2>
          <ul>
            <li>Squarespace, Wix, WordPress, Webflow, Shopify, and custom-built sites</li>
            <li>JavaScript-rendered pages (React, Vue, Angular SPAs)</li>
            <li>Runs in any browser on Windows, Linux, Mac, or Chromebook — no install (a cross-platform SiteSucker alternative)</li>
          </ul>
